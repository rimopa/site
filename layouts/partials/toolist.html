{{ $section:=.Section }}
<h2>Full toolist</h2>
<ul>
  {{ range where .Site.RegularPages "Section" $section }}
  {{ $desc:=.Params.description }}
  <li title="{{ $desc }}">
    <a href="{{ .Permalink }}">{{ .Params.tool }}</a>
    <br>
    <small>{{ $desc }}</small>
  </li>
  {{ end }}
</ul>
<h2 title="not my fault, JS's.">
  Remember the results of these tools are approximate
</h2>
