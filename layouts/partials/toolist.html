{{ $section:=.Section }}
<h2>Full toolist</h2>
<ul class="tool-list">
  {{ range where .Site.RegularPages "Section" $section}}{{$desc:=.Params.description}}
  <li title="{{ $desc }}">
    <a href="{{ .RelPermalink }}">{{ .Params.tool }}</a>
    <br />
    <small>{{ $desc }}</small>
  </li>
  {{ else }}
  <li>No pages found in {{ $section }}</li>
  {{ end }}
</ul>
<h2>Remember the results of these tools are approximate</h2>
