{{define "main"}}
<h1>Problema Digital</h1>
<h2>A little spanish game friends made in school</h2>
<iframe id="problemaDigital" src="/problemaDigital.html" width="100%" height="500" style="border: none" loading="lazy"
  title="Problema" allowfullscreen requestFullscreen>
</iframe>
<button class="math" onclick="goFullscreen()">Fullscreen</button>
<script>
  function goFullscreen() {
    const iframe = document.getElementById("problemaDigital");
    if (iframe.requestFullscreen) {
      iframe.requestFullscreen();
    } else if (iframe.webkitRequestFullscreen) {
      iframe.webkitRequestFullscreen();
    } else if (iframe.mozRequestFullScreen) {
      iframe.mozRequestFullScreen();
    } else if (iframe.msRequestFullscreen) {
      iframe.msRequestFullscreen();
    } else {
      alert("Fullscreen not supported in this browser.");
    }
  }
</script>
{{end}}
